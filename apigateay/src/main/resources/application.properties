spring.application.name=apigateay

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.routes[0].id=productservice
spring.cloud.gateway.routes[0].uri=lb://productservice
spring.cloud.gateway.routes[0].predicates[0]=Path=/products/**


spring.cloud.gateway.routes[1].id=inventryservice
spring.cloud.gateway.routes[1].uri=lb://inventryservice
spring.cloud.gateway.routes[1].predicates[0]=Path=/inventory/**


spring.cloud.gateway.routes[2].id=orderservice
spring.cloud.gateway.routes[2].uri=lb://orderservice
spring.cloud.gateway.routes[2].predicates[0]=Path=/orders/**


logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG


management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always




