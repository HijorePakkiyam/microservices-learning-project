spring.application.name=orderservice
server.port=8083


spring.datasource.url=jdbc:mysql://localhost:3306/orderdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Hijore@2000
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
#need to check
spring.jpa.properties.hibernate.format_sql=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

#circuitbreaker-reslience4J
resilience4j.circuitbreaker.instances.inventryservice.slidingWindowSize=5
resilience4j.circuitbreaker.instances.inventryservice.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventryservice.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.inventryservice.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.inventryservice.minimumNumberOfCalls=5
